" y2="857.8447"/><polygon fill="#383838" points="143.5,847.8447,147.5,857.8447,151.5,847.8447,147.5,851.8447" style="stroke: #383838; stroke-width: 1.0;"/><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName SansSerif
skinparam defaultFontSize 15

start
:Read the recipe number;
if () then ([not a positive whole number\nor no such recipe])
  :Show error;
  stop
else ([else])
endif
:Find the title/, type/ and n/ values;
if () then ([no prefix given, a prefix repeated,\ntext before the first prefix,\nor an empty value])
  :Show error;
  stop
else ([else])
endif
if () then ([new title used by\nanother recipe])
  :Show error;
  stop
else ([else])
endif
:Apply every new value to the recipe;
:Show the updated recipe;
stop
@enduml

