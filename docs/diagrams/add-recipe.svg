97" y1="698.9883" y2="698.9883"/><polygon fill="#383838" points="905,727.1377,915,731.1377,905,735.1377,909,731.1377" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0;" x1="241" x2="911" y1="731.1377" y2="731.1377"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="231" x="463.5" y="725.5195">showMessage(label + " added!")</text><polygon fill="#383838" points="252,741.1377,242,745.1377,252,749.1377,248,745.1377" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="246" x2="921" y1="745.1377" y2="745.1377"/><polygon fill="#383838" points="905,773.2871,915,777.2871,905,781.2871,909,777.2871" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0;" x1="241" x2="911" y1="777.2871" y2="777.2871"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="222" x="468" y="771.6689">showAllergenWarnings(recipe)</text><polygon fill="#383838" points="252,787.2871,242,791.2871,252,795.2871,248,791.2871" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="246" x2="921" y1="791.2871" y2="791.2871"/><polygon fill="#383838" points="80,801.2871,70,805.2871,80,809.2871,76,805.2871" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="74" x2="235" y1="805.2871" y2="805.2871"/><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName SansSerif
skinparam defaultFontSize 15
skinparam sequenceMessageAlign center
hide footbox

participant ":WhatsCooking" as App
participant ":AddCommand" as Command
participant "<<class>>\nRecipeInputParser" as Input
participant "recipes:RecipeList" as Recipes
participant "recipe:Recipe" as Recipe
participant ":Ui" as UI

App -> Command : execute(recipes, ui)
activate Command
Command -> Command : split input at n/, st/, i/, s/
activate Command
Command - -> Command
deactivate Command

Command -> Input : parseTitle(titleText)
activate Input
Input - -> Command : title
deactivate Input

Command -> Recipes : containsTitle(title)
activate Recipes
Recipes - -> Command : isTaken
deactivate Recipes
note right of Command
  If isTaken is true, a WhatsCookingException
  is thrown here and the list is not changed.
  This path assumes a new title.
end note

create Recipe
Command -> Recipe : Recipe(title, type)
activate Recipe
Recipe - -> Command
deactivate Recipe

Command -> Recipe : setServingSize(servingSize)
activate Recipe
Recipe - -> Command
deactivate Recipe

Command -> Input : addIngredients(recipe, ingredientText)
activate Input
loop for each ingredient
  Input -> Recipe : addIngredient(ingredient)
  activate Recipe
  Recipe - -> Input
  deactivate Recipe
end
Input - -> Command
deactivate Input
note right of Command
  addSteps(...) adds each step the same way.
  Every part is checked before the next step.
end note

Command -> Recipes : add(recipe)
activate Recipes
Recipes - -> Command
deactivate Recipes

Command -> UI : showMessage(label + " added!")
activate UI
UI - -> Command
deactivate UI
Command -> UI : showAllergenWarnings(recipe)
activate UI
UI - -> Command
deactivate UI

Command - -> App
deactivate Command
@enduml

