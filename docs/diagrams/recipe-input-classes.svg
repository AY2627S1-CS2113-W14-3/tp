t fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="94" x="300" y="222.5313">check values</text><!--link AddCommand to RecipeList--><path d="M143.15,177.07 C144.57,193.23 148.93,213.42 161,227 C186.77,256.01 208.19,239.85 243,257 C262.43,266.57 282.6,278.4 301,290.01 " fill="none" id="AddCommand-RecipeList" style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="305.64,292.95,300.1676,284.7614,301.4129,290.2795,295.8948,291.5248,305.64,292.95" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="109" x="162" y="222.5313">check title, add</text><!--link EditCommand to RecipeList--><path d="M390.3,177.16 C400.63,185.29 410.21,195.25 416,207 C428.8,232.96 419.36,263.4 405.78,288.34 " fill="none" id="EditCommand-RecipeList" style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="403.2,292.93,411.0822,287.0248,405.6391,288.5653,404.0986,283.1222,403.2,292.93" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="161" x="422" y="222.5313">find recipe, check title</text><!--link RecipeInputParser to Recipe--><path d="M134.05,420.18 C139.15,437.05 145.42,454.44 153,470 C157.11,478.45 161.82,486.93 166.86,495.27 " fill="none" id="RecipeInputParser-Recipe" style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="169.7,499.88,168.3989,490.1175,167.0835,495.6193,161.5817,494.3039,169.7,499.88" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="158" x="154" y="465.5313">add ingredients, steps</text><!--link RecipeList to Recipe--><path d="M353.87,384.04 C344.12,409.62 330.92,442.1 317,470 C312.86,478.3 308.36,486.8 303.7,495.25 " fill="none" id="RecipeList-Recipe" style="stroke: #383838; stroke-width: 1.0;"/><polygon fill="#383838" points="301.09,499.94,308.9574,494.0152,303.5182,495.5692,301.9642,490.13,301.09,499.94" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="54" x="326" y="465.5313">recipes</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="25" x="279.5805" y="488.535">0..*</text><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam defaultFontName SansSerif
skinparam defaultFontSize 15
hide empty members
hide circle
top to bottom direction

abstract class Command {
  +{abstract} execute(recipes, ui)
}
class AddCommand {
  +execute(recipes, ui)
}
class EditCommand {
  +execute(recipes, ui)
}
class RecipeInputParser <<utility>> {
  ~{static} parseTitle(text): String
  ~{static} parseType(text): String
  ~{static} parseServingSize(text): int
  ~{static} addIngredients(recipe, text)
  ~{static} addSteps(recipe, text)
  ~{static} parseNote(text): String
}
class RecipeList {
  +containsTitle(title): boolean
  +add(recipe)
  +get(index): Recipe
}
class Recipe {
  -title: String
  -type: String
  -servingSize: int
  -note: String
  +setTitle(title)
  +setType(type)
  +setServingSize(servingSize)
  +setNote(note)
}

AddCommand -up-|> Command
EditCommand -up-|> Command
AddCommand ..> RecipeInputParser : check values
EditCommand ..> RecipeInputParser : check values
AddCommand ..> RecipeList : check title, add
EditCommand ..> RecipeList : find recipe, check title
RecipeInputParser ..> Recipe : add ingredients, steps
RecipeList - -> "0..*" Recipe : recipes
@enduml

