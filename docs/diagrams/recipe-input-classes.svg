roke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="161" x="447.5" y="222.5313">find recipe, check title</text><!--link RecipeInputParser to Recipe--><path d="M161.58,456.17 C167.53,473.05 174.23,490.22 181.5,506 C185.32,514.28 189.5,522.69 193.91,531.06 " fill="none" id="RecipeInputParser-Recipe" style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#383838" points="196.38,535.7,195.7071,525.8742,194.0419,531.2804,188.6357,529.6152,196.38,535.7" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="158" x="182.5" y="501.5313">add ingredients, steps</text><!--link RecipeList to Recipe--><path d="M383.91,411.15 C373.51,439.7 359.8,475.19 345.5,506 C341.65,514.29 337.53,522.76 333.26,531.23 " fill="none" id="RecipeList-Recipe" style="stroke: #383838; stroke-width: 1.0;"/><polygon fill="#383838" points="330.87,535.94,338.5046,529.718,333.1289,531.4794,331.3675,526.1037,330.87,535.94" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="54" x="354.5" y="501.5313">recipes</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="25" x="309.2878" y="524.2873">0..*</text><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam defaultFontName SansSerif
skinparam defaultFontSize 15
hide empty members
hide circle
top to bottom direction

abstract class Command {
  +{abstract} execute(recipes, ui)
}
class AddCommand {
  +execute(recipes, ui)
}
class EditCommand {
  +execute(recipes, ui)
}
class RecipeInputParser <<utility>> {
  ~{static} parseTitle(text): String
  ~{static} parseType(text): String
  ~{static} parseServingSize(text): int
  ~{static} parseIngredient(text): Ingredient
  ~{static} parseStep(text): String
  ~{static} addIngredients(recipe, text)
  ~{static} addSteps(recipe, text)
  ~{static} parseNote(text): String
}
class RecipeList {
  +containsTitle(title): boolean
  +getByName(name): Recipe
  +add(recipe)
  +get(index): Recipe
}
class Recipe {
  -title: String
  -type: String
  -servingSize: int
  -note: String
  +setTitle(title)
  +setType(type)
  +setIngredient(index, ingredient)
  +setStep(index, step)
  +setServingSize(servingSize)
  +setNote(note)
}

AddCommand -up-|> Command
EditCommand -up-|> Command
AddCommand ..> RecipeInputParser : check values
EditCommand ..> RecipeInputParser : check values
AddCommand ..> RecipeList : check title, add
EditCommand ..> RecipeList : find recipe, check title
RecipeInputParser ..> Recipe : add ingredients, steps
RecipeList - -> "0..*" Recipe : recipes
@enduml

