2.93,486.23 308.53,494.64 303.97,503.03 " fill="none" id="RecipeList-Recipe" style="stroke: #383838; stroke-width: 1.0;"/><polygon fill="#383838" points="301.42,507.68,309.2494,501.7051,303.8203,503.2938,302.2315,497.8646,301.42,507.68" style="stroke: #383838; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="54" x="326" y="473.5313">recipes</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacingAndGlyphs" textLength="25" x="279.7923" y="496.4384">0..*</text><!--
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam classAttributeIconSize 0
skinparam defaultFontName SansSerif
skinparam defaultFontSize 15
hide empty members
top to bottom direction

abstract class Command {
  +{abstract} execute(recipes, ui)
}
class AddCommand {
  +execute(recipes, ui)
}
class EditCommand {
  +execute(recipes, ui)
}
class RecipeInputParser <<utility>> {
  ~{static} parseTitle(text): String
  ~{static} parseType(text): String
  ~{static} parseServingSize(text): int
  ~{static} addIngredients(recipe, text)
  ~{static} addSteps(recipe, text)
  ~{static} parseNote(text): String
}
class RecipeList {
  +containsTitle(title): boolean
  +add(recipe)
  +get(index): Recipe
}
class Recipe {
  -title: String
  -type: String
  -servingSize: int
  -note: String
  +setTitle(title)
  +setType(type)
  +setServingSize(servingSize)
  +setNote(note)
}

AddCommand -up-|> Command
EditCommand -up-|> Command
AddCommand ..> RecipeInputParser : check values
EditCommand ..> RecipeInputParser : check values
AddCommand ..> RecipeList : check title, add
EditCommand ..> RecipeList : find recipe, check title
RecipeInputParser ..> Recipe : add ingredients, steps
RecipeList - -> "0..*" Recipe : recipes
@enduml

